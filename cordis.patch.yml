# AI 拟人主题包：按 provider / 模型给对话区换立绘，并全局换像素字体。
#
# 规则顺序即优先级，后面的覆盖前面的；`*` 结尾表示前缀匹配。
# 图片来自包内 wallpapers/gijinka/，首次启动会复制到 ~/.dsh/themes/images/，
# 之后可以直接替换或新增图片（同名覆盖即可）。
- insert:
    - id: ai-girl-theme
      name: 'dsh-ai-girl-theme'
      config:
        enabled: true
        dir: '~/.dsh/themes/images'
        veilDark: 0.4
        veilLight: 0.6
        scrimDark: 0.68
        scrimLight: 0.88
        font: true
        families: []
        rules:
          - { provider: 'anthropic*', image: gijinka/claude-wallpaper.webp }
          - { provider: 'openai*', image: gijinka/gpt-wallpaper.webp }
          - { provider: 'google*', image: gijinka/gemini.webp }
          - { provider: 'zhipu*', image: gijinka/glm-wallpaper.webp }
          - { provider: 'bigmodel*', image: gijinka/glm-wallpaper.webp }
          - { provider: 'moonshot*', image: gijinka/kimi-wallpaper.webp }
          - { provider: 'xai*', image: gijinka/grok-wallpaper.webp }
          - { provider: 'mistral*', image: gijinka/mistral.webp }
          - { provider: 'minimax*', image: gijinka/minimax.webp }
          - { provider: 'tencent*', image: gijinka/hunyuan.webp }
          - { provider: 'baidu*', image: gijinka/wenxin-wallpaper.webp }
          - { provider: 'alibaba*', image: gijinka/qwen-wallpaper.webp }
          - { provider: 'dashscope*', image: gijinka/qwen-wallpaper.webp }
          - { provider: 'deepseek*', image: gijinka/deepseek-wallpaper.webp }
          - { model: 'claude*', image: gijinka/claude-wallpaper.webp }
          - { model: 'gpt*', image: gijinka/gpt-wallpaper.webp }
          - { model: 'chatgpt*', image: gijinka/gpt-wallpaper.webp }
          - { model: 'o1*', image: gijinka/gpt-wallpaper.webp }
          - { model: 'o3*', image: gijinka/gpt-wallpaper.webp }
          - { model: 'o4*', image: gijinka/gpt-wallpaper.webp }
          - { model: 'gpt-image*', image: gijinka/gpt-image2.webp }
          - { model: 'gemini*', image: gijinka/gemini.webp }
          - { model: 'gemma*', image: gijinka/gemini.webp }
          - { model: 'glm*', image: gijinka/glm-wallpaper.webp }
          - { model: 'kimi*', image: gijinka/kimi-wallpaper.webp }
          - { model: 'moonshot*', image: gijinka/kimi-wallpaper.webp }
          - { model: 'grok*', image: gijinka/grok-wallpaper.webp }
          - { model: 'llama*', image: gijinka/llama.webp }
          - { model: 'mistral*', image: gijinka/mistral.webp }
          - { model: 'mixtral*', image: gijinka/mistral.webp }
          - { model: 'codestral*', image: gijinka/mistral.webp }
          - { model: 'minimax*', image: gijinka/minimax.webp }
          - { model: 'abab*', image: gijinka/minimax.webp }
          - { model: 'hunyuan*', image: gijinka/hunyuan.webp }
          - { model: 'ernie*', image: gijinka/wenxin-wallpaper.webp }
          - { model: 'wenxin*', image: gijinka/wenxin-wallpaper.webp }
          - { model: 'qwen*', image: gijinka/qwen-wallpaper.webp }
          - { model: 'qwq*', image: gijinka/qwen-wallpaper.webp }
          - { model: 'seed*', image: gijinka/seed-wallpaper.webp }
          - { model: 'doubao*', image: gijinka/seed-wallpaper.webp }
          - { model: 'rwkv*', image: gijinka/rwkv-wallpaper.webp }

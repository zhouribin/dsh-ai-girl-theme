name: validate-market-index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DSH's market-index validator
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh-plugin-market-index@next
      - name: Validate market-index.json
        run: node scripts/validate-market-index.mjs
      - name: Check the bundle still parses
        run: node --check index.js && node --check client.js
